<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration</title>
</head>
<body>

<form th:action="@{/auth/registration}" th:method="POST" th:object="${person}">
    <label for="username">Введите имя пользователя:</label>
    <input type="text" id="username" name="username" th:field="${person.username}">
    <div style="color: red" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Username Error</div>
    <br/>
    <label for="password">Введите пароль пользователя:</label>
    <input type="password" id="password" name="password" th:field="${person.password}">
    <div style="color: red" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password Error</div>
    <br/>
    <input type="submit" value="Sign Up!">
</form>

</body>
</html>
